const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
svg.setAttribute('viewBox', `0 0 ${SPEC.w} ${SPEC.h}`);
svg.setAttribute('width', SPEC.w); svg.setAttribute('height', SPEC.h);

const legend = document.getElementById('legend');
for (const lv of Object.values(SPEC.levels))
  legend.innerHTML += `<span><i style="background:${lv.c}"></i>${lv.fr}</span>`;

const nodes = {}; SPEC.nodes.forEach(n => nodes[n.id] = n);
const NODE_H = 56;
function cx(n) { return n.x; } function cy(n) { return n.y; }

/* arêtes d'abord (sous les nœuds) */
const edgeEls = [];
const defs = document.createElementNS(NS, 'defs');
defs.innerHTML = `<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#8fa5ba"/></marker>
  <marker id="arrHl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#ffd43b"/></marker>`;
svg.appendChild(defs);
for (const [a, b, sec] of SPEC.edges) {
  const A = nodes[a], B = nodes[b];
  const x1 = cx(A) + A.w / 2, y1 = cy(A), x2 = cx(B) - B.w / 2, y2 = cy(B);
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', `M ${x1} ${y1} C ${x1 + 28} ${y1}, ${x2 - 28} ${y2}, ${x2} ${y2}`);
  p.setAttribute('class', 'edge' + (sec ? ' sec' : ''));
  p.setAttribute('marker-end', 'url(#arr)');
  p.dataset.a = a; p.dataset.b = b;
  svg.appendChild(p); edgeEls.push(p);
}

const nodeEls = {};
for (const n of SPEC.nodes) {
  const lv = SPEC.levels[n.lvl];
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'node'); g.dataset.id = n.id;
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x', cx(n) - n.w / 2); r.setAttribute('y', cy(n) - NODE_H / 2);
  r.setAttribute('width', n.w); r.setAttribute('height', NODE_H); r.setAttribute('rx', 10);
  r.setAttribute('fill', '#22262e'); r.setAttribute('stroke', lv.c);
  g.appendChild(r);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', cx(n)); t.setAttribute('y', cy(n) - (n.sub ? 3 : -4));
  t.setAttribute('text-anchor', 'middle'); t.textContent = n.label;
  g.appendChild(t);
  if (n.sub) {
    const s = document.createElementNS(NS, 'text');
    s.setAttribute('x', cx(n)); s.setAttribute('y', cy(n) + 14);
    s.setAttribute('text-anchor', 'middle'); s.setAttribute('class', 'sub');
    s.textContent = n.sub; g.appendChild(s);
  }
  if (n.note) {
    const b = document.createElementNS(NS, 'text');
    b.setAttribute('x', cx(n)); b.setAttribute('y', cy(n) - NODE_H / 2 - 5);
    b.setAttribute('text-anchor', 'middle'); b.setAttribute('class', 'badge');
    b.textContent = '⚠ ' + n.note.fr; g.appendChild(b);
  }
  g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
  svg.appendChild(g); nodeEls[n.id] = g;
}

/* chemin complet : ancêtres + descendants via les arêtes */
function pathSet(id) {
  const out = new Set([id]), edgesOn = new Set();
  const fwd = {}, bwd = {};
  SPEC.edges.forEach(([a, b], i) => { (fwd[a] = fwd[a] || []).push(i); (bwd[b] = bwd[b] || []).push(i); });
  const walk = (map, next) => {
    const stack = [id];
    while (stack.length) {
      const cur = stack.pop();
      for (const i of (map[cur] || [])) {
        edgesOn.add(i);
        const other = next(i);
        if (!out.has(other)) { out.add(other); stack.push(other); }
      }
    }
  };
  walk(fwd, i => SPEC.edges[i][1]);
  walk(bwd, i => SPEC.edges[i][0]);
  return { out, edgesOn };
}

let selected = null;
function select(id) {
  selected = id;
  const { out, edgesOn } = pathSet(id);
  for (const [nid, el] of Object.entries(nodeEls)) {
    el.classList.toggle('dim', !out.has(nid));
    el.classList.toggle('hl-node', nid === id);
  }
  edgeEls.forEach((p, i) => {
    p.classList.toggle('dim', !edgesOn.has(i));
    p.classList.toggle('hl-edge', edgesOn.has(i));
    p.setAttribute('marker-end', edgesOn.has(i) ? 'url(#arrHl)' : 'url(#arr)');
  });
  const n = nodes[id];
  const fiche = document.getElementById('fiche');
  fiche.innerHTML = `<b>${n.label}</b> ${n.sub ? `<span class="sub">— ${n.sub}</span>` : ''}` +
    (n.note ? ` <span class="sub" style="color:#ffd43b">⚠ ${n.note.fr} (non modélisé en 3D)</span>` : '') +
    `<p>${n.desc.fr}</p><p class="en">${n.desc.en}</p>` +
    `<button onclick="resetSel()">Tout réinitialiser</button>`;
  fiche.style.display = 'block';
}
function resetSel() {
  selected = null;
  for (const el of Object.values(nodeEls)) el.classList.remove('dim', 'hl-node');
  edgeEls.forEach(p => { p.classList.remove('dim', 'hl-edge'); p.setAttribute('marker-end', 'url(#arr)'); });
  document.getElementById('fiche').style.display = 'none';
}
svg.addEventListener('click', resetSel);
window.__diagramTest = { select, reset: resetSel,
  state: () => ({ selected, nodes: SPEC.nodes.length, edges: SPEC.edges.length }) };
</script>
