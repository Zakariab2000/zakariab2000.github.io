<title>Segmentation hépatique de Couinaud — schéma interactif — Schéma interactif (Batch D)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif;
         background:#101418; color:#eef2f5; }
  header { padding:14px 16px 6px; }
  h1 { font-size:19px; margin:0 0 4px; font-weight:600; }
  .sous { color:#9fb2c1; font-size:13px; font-style:italic; }
  #legende { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:20px;
          border:1px solid #3a4652; }
  .chip i { display:inline-block; width:9px; height:9px; border-radius:50%;
             margin-right:5px; }
  #wrap { padding:4px 8px; }
  svg { width:100%; height:auto; display:block; }
  .edge { fill:none; stroke:#5d6d7e; stroke-width:2; opacity:.55; }
  .edge.sec { stroke-dasharray:5 5; opacity:.4; }
  .edge.on { stroke:#ffd166; stroke-width:3.5; opacity:1; }
  .nd { cursor:pointer; }
  .nd rect, .nd circle { stroke-width:1.6; }
  .nd text { fill:#10151a; font-family: Georgia, serif; pointer-events:none; }
  .nd .lb { font-size:14.5px; font-weight:700; }
  .nd .sb { font-size:11px; font-style:italic; fill:#26313b; }
  svg.dim .nd { opacity:.28; } svg.dim .edge { opacity:.12; }
  svg.dim .nd.on, svg.dim .nd.linked { opacity:1; }
  #fiche { margin:10px 12px 20px; padding:13px 15px; background:#182029;
            border:1px solid #2c3947; border-radius:10px; min-height:86px; }
  #fiche h2 { margin:0 0 2px; font-size:17px; }
  #fiche .sub { color:#9fb2c1; font-style:italic; font-size:13px;
                 margin-bottom:6px; }
  #fiche p { margin:0; font-size:14.5px; line-height:1.5; }
  #fiche .note3d { margin-top:8px; font-size:12.5px; color:#ffd166; }
  #fiche .vide { color:#9fb2c1; font-style:italic; }
</style>

<body>
<header>
  <h1>Segmentation hépatique de Couinaud — schéma interactif</h1>
  <div class="sous">Figure 73 — Segmentation hépatique fonctionnelle selon Couinaud — toucher un élément pour le surligner et lire sa fiche.</div>
</header>
<div id="legende"></div>
<div id="wrap"><svg id="svg" viewBox="0 0 720 830" role="img"></svg></div>
<section id="fiche"><p class="vide">Aucun élément sélectionné.</p></section>
<script>
const D = {"titre_fr": "Segmentation hépatique de Couinaud — schéma interactif", "titre_en": "Couinaud liver segmentation — interactive diagram", "w": 720, "h": 830, "levels": {"porte": {"c": "#5b8dd9", "fr": "Pédicule porte", "en": "Portal pedicle"}, "secteur": {"c": "#58d68d", "fr": "Secteurs", "en": "Sectors"}, "segment": {"c": "#f0a13c", "fr": "Segments", "en": "Segments"}, "veine": {"c": "#b388ff", "fr": "Veines sus-hépatiques (scissures)", "en": "Hepatic veins (scissurae)"}}, "nodes": [{"id": "porte", "x": 100, "y": 450, "w": 170, "label": "Tronc porte", "sub": "bifurcation au hile", "label_en": "Portal trunk", "sub_en": "bifurcation at the hilum", "lvl": "porte", "desc": {"fr": "Tronc de la veine porte au niveau du hile : sa bifurcation en branches droite et gauche fonde la segmentation portale. La scissure portale principale (médiane), repérée par la fossette cystique, sépare le foie droit (branche droite) du foie gauche (branche gauche). Les segments sont numérotés sur la face inférieure du foie en tournant autour du tronc porte dans le sens inverse des aiguilles d'une montre (cours Q26).", "en": "Portal vein trunk at the hilum: its bifurcation into right and left branches is the basis of the portal segmentation. The main (median) portal scissura, marked by the cystic fossa, separates the right liver (right branch) from the left liver (left branch). Segments are numbered on the inferior face of the liver, turning around the portal trunk anticlockwise (course Q26)."}}, {"id": "br_d", "x": 275, "y": 290, "w": 160, "label": "Branche droite", "sub": "de la veine porte", "label_en": "Right branch", "sub_en": "of the portal vein", "lvl": "porte", "desc": {"fr": "Branche droite de la veine porte : courte, elle irrigue le foie droit et se divise en 2 branches, antérieure et postérieure, qui délimitent les 2 secteurs droits séparés par la scissure droite. Elle reçoit la veine cystique (cours Q27).", "en": "Right branch of the portal vein: short, it supplies the right liver and divides into anterior and posterior branches, defining the 2 right sectors separated by the right scissura. It receives the cystic vein (course Q27)."}}, {"id": "br_g", "x": 275, "y": 610, "w": 160, "label": "Branche gauche", "sub": "de la veine porte", "label_en": "Left branch", "sub_en": "of the portal vein", "lvl": "porte", "desc": {"fr": "Branche gauche de la veine porte : plus longue que la droite, elle gagne l'extrémité gauche du hile, irrigue le foie gauche et se divise en branches antérieure et postérieure déterminant les secteurs médial et latéral gauches, séparés par la scissure gauche.", "en": "Left branch of the portal vein: longer than the right, it reaches the left end of the hilum, supplies the left liver and divides into anterior and posterior branches defining the left medial and lateral sectors, separated by the left scissura."}}, {"id": "sect_ad", "x": 460, "y": 180, "w": 170, "label": "Secteur antérieur", "sub": "droit", "label_en": "Right anterior", "sub_en": "sector", "lvl": "secteur", "desc": {"fr": "Secteur antérieur droit, entre la scissure principale et la scissure droite ; pédicule : branche antérieure de la branche droite porte. Il comprend 2 segments : V (antéro-inférieur) et VIII (antéro-supérieur).", "en": "Right anterior sector, between the main scissura and the right scissura; pedicle: anterior branch of the right portal branch. It contains 2 segments: V (antero-inferior) and VIII (antero-superior)."}}, {"id": "sect_pd", "x": 460, "y": 320, "w": 170, "label": "Secteur postérieur", "sub": "droit", "label_en": "Right posterior", "sub_en": "sector", "lvl": "secteur", "desc": {"fr": "Secteur postérieur droit, en arrière de la scissure droite ; pédicule : branche postérieure de la branche droite porte. Il comprend 2 segments : VI (postéro-inférieur) et VII (postéro-supérieur).", "en": "Right posterior sector, behind the right scissura; pedicle: posterior branch of the right portal branch. It contains 2 segments: VI (postero-inferior) and VII (postero-superior)."}}, {"id": "sect_mg", "x": 460, "y": 580, "w": 170, "label": "Secteur médial", "sub": "gauche", "label_en": "Left medial", "sub_en": "sector", "lvl": "secteur", "desc": {"fr": "Secteur médial gauche, entre la scissure principale et la scissure gauche ; pédicule : branche gauche de la veine porte. Il comprend le segment IV : IVa supérieur (parfois noté IX) et IVb inférieur, qui correspond au lobe carré.", "en": "Left medial sector, between the main scissura and the left scissura; pedicle: left portal branch. It contains segment IV: upper IVa (sometimes labelled IX) and lower IVb, which corresponds to the quadrate lobe."}}, {"id": "sect_lg", "x": 460, "y": 710, "w": 170, "label": "Secteur latéral", "sub": "gauche", "label_en": "Left lateral", "sub_en": "sector", "lvl": "secteur", "desc": {"fr": "Secteur latéral gauche, en dehors de la scissure gauche ; pédicule : branche gauche de la veine porte. Il comprend 2 segments : II (latéro-supérieur) et III (latéro-inférieur).", "en": "Left lateral sector, lateral to the left scissura; pedicle: left portal branch. It contains 2 segments: II (latero-superior) and III (latero-inferior)."}}, {"id": "seg1", "x": 460, "y": 450, "w": 170, "label": "Segment I", "sub": "caudé (Spiegel)", "label_en": "Segment I", "sub_en": "caudate (Spiegel)", "lvl": "segment", "desc": {"fr": "Segment I (caudé) — segment dorsal, situé en arrière du tronc de la veine porte ; il constitue à lui seul le lobe caudé (lobe de Spiegel). Vascularisation porte variable : branche droite, branche gauche ou les deux. Drainage sus-hépatique propre : les veines dorsales se jettent directement dans la veine cave inférieure (secteur dorsal) — c'est le seul point où les 2 segmentations se superposent.", "en": "Segment I (caudate) — the dorsal segment, lying behind the portal vein trunk; it alone forms the caudate lobe (Spiegel's lobe). Variable portal supply: right branch, left branch, or both. Its own suprahepatic drainage: dorsal veins opening directly into the inferior vena cava (dorsal sector) — the only point where the 2 segmentations coincide."}}, {"id": "seg8", "x": 645, "y": 130, "w": 140, "label": "Segment VIII", "sub": "antéro-supérieur", "label_en": "Segment VIII", "sub_en": "antero-superior", "lvl": "segment", "desc": {"fr": "Segment VIII — segment antéro-supérieur du secteur antérieur droit. Vascularisation porte : branche antérieure de la branche droite. C'est le seul segment visible uniquement sur la face diaphragmatique du foie (cours Q26). Drainage sus-hépatique par les veines cheminant dans les scissures principale et droite.", "en": "Segment VIII — antero-superior segment of the right anterior sector. Portal supply: anterior branch of the right portal branch. It is the only segment visible solely on the diaphragmatic face of the liver (course Q26). Suprahepatic drainage via the veins running in the main and right scissurae."}}, {"id": "seg5", "x": 645, "y": 235, "w": 140, "label": "Segment V", "sub": "antéro-inférieur", "label_en": "Segment V", "sub_en": "antero-inferior", "lvl": "segment", "desc": {"fr": "Segment V — segment antéro-inférieur du secteur antérieur droit, au contact de la fossette cystique et de la vésicule biliaire. Vascularisation porte : branche antérieure de la branche droite. Drainage sus-hépatique par les veines des scissures principale et droite.", "en": "Segment V — antero-inferior segment of the right anterior sector, in contact with the cystic fossa and the gallbladder. Portal supply: anterior branch of the right portal branch. Suprahepatic drainage via the veins of the main and right scissurae."}}, {"id": "seg7", "x": 645, "y": 340, "w": 140, "label": "Segment VII", "sub": "postéro-supérieur", "label_en": "Segment VII", "sub_en": "postero-superior", "lvl": "segment", "desc": {"fr": "Segment VII — segment postéro-supérieur du secteur postérieur droit. Vascularisation porte : branche postérieure de la branche droite. Drainage sus-hépatique : veine hépatique droite, qui chemine dans la scissure droite.", "en": "Segment VII — postero-superior segment of the right posterior sector. Portal supply: posterior branch of the right portal branch. Suprahepatic drainage: right hepatic vein, running in the right scissura."}}, {"id": "seg6", "x": 645, "y": 445, "w": 140, "label": "Segment VI", "sub": "postéro-inférieur", "label_en": "Segment VI", "sub_en": "postero-inferior", "lvl": "segment", "desc": {"fr": "Segment VI — segment postéro-inférieur du secteur postérieur droit. Vascularisation porte : branche postérieure de la branche droite. Drainage sus-hépatique : veine hépatique droite (scissure droite).", "en": "Segment VI — postero-inferior segment of the right posterior sector. Portal supply: posterior branch of the right portal branch. Suprahepatic drainage: right hepatic vein (right scissura)."}}, {"id": "seg4", "x": 645, "y": 580, "w": 140, "label": "Segment IV", "sub": "IVa sup. · IVb inf.", "label_en": "Segment IV", "sub_en": "upper IVa · lower IVb", "lvl": "segment", "desc": {"fr": "Segment IV — segment du secteur médial gauche : IVa supérieur (parfois noté segment IX) et IVb inférieur, correspondant au lobe carré, en avant du hile. Vascularisation porte : branche gauche. Drainage sus-hépatique : partie centrale du foie, veine hépatique médiane (et gauche). Dans le modèle 3D, un seul maillage : left_medial_segment_of_liver_iv (IVa et IVb non séparés).", "en": "Segment IV — segment of the left medial sector: upper IVa (sometimes labelled segment IX) and lower IVb, corresponding to the quadrate lobe, in front of the hilum. Portal supply: left branch. Suprahepatic drainage: central part of the liver, middle (and left) hepatic vein. In the 3D model, a single mesh: left_medial_segment_of_liver_iv (IVa and IVb not separated)."}}, {"id": "seg2", "x": 645, "y": 665, "w": 140, "label": "Segment II", "sub": "latéro-supérieur", "label_en": "Segment II", "sub_en": "latero-superior", "lvl": "segment", "desc": {"fr": "Segment II — segment latéro-supérieur du secteur latéral gauche, extrémité gauche du foie. Vascularisation porte : branche gauche. Drainage sus-hépatique : veine hépatique gauche, qui chemine dans la scissure gauche (secteur sus-hépatique gauche, lobe gauche morphologique séparé par le ligament falciforme).", "en": "Segment II — latero-superior segment of the left lateral sector, at the left extremity of the liver. Portal supply: left branch. Suprahepatic drainage: left hepatic vein, running in the left scissura (left suprahepatic sector, morphological left lobe separated by the falciform ligament)."}}, {"id": "seg3", "x": 645, "y": 760, "w": 140, "label": "Segment III", "sub": "latéro-inférieur", "label_en": "Segment III", "sub_en": "latero-inferior", "lvl": "segment", "desc": {"fr": "Segment III — segment latéro-inférieur du secteur latéral gauche. Vascularisation porte : branche gauche. Drainage sus-hépatique : veine hépatique gauche (scissure gauche).", "en": "Segment III — latero-inferior segment of the left lateral sector. Portal supply: left branch. Suprahepatic drainage: left hepatic vein (left scissura)."}}, {"id": "vh_d", "x": 545, "y": 250, "r": 10, "label": "V. hép. droite", "lvl": "veine", "desc": {"fr": "Veine hépatique (sus-hépatique) droite — chemine dans la scissure droite ; elle draine le secteur sus-hépatique droit (la moitié droite du lobe droit) vers la veine cave inférieure. En 3D, les 3 veines sus-hépatiques forment un seul maillage groupé (hepatic_veins), non séparable veine par veine (audit fig. 74).", "en": "Right hepatic (suprahepatic) vein — runs in the right scissura; it drains the right suprahepatic sector (the right half of the right lobe) into the inferior vena cava. In 3D, the 3 hepatic veins form a single grouped mesh (hepatic_veins) that cannot be separated vein by vein (audit fig. 74)."}}, {"id": "vh_m", "x": 545, "y": 510, "r": 10, "label": "V. hép. médiane", "lvl": "veine", "desc": {"fr": "Veine hépatique médiane (sagittale, intermédiaire) — chemine dans la scissure principale ; elle draine le secteur sus-hépatique médian, c'est-à-dire la partie centrale du foie, vers la veine cave inférieure. En 3D : maillage groupé hepatic_veins, non séparable (audit fig. 74).", "en": "Middle hepatic vein (sagittal, intermediate) — runs in the main scissura; it drains the median suprahepatic sector, i.e. the central part of the liver, into the inferior vena cava. In 3D: grouped hepatic_veins mesh, not separable (audit fig. 74)."}}, {"id": "vh_g", "x": 545, "y": 640, "r": 10, "label": "V. hép. gauche", "lvl": "veine", "desc": {"fr": "Veine hépatique gauche — chemine dans la scissure gauche ; elle draine le secteur sus-hépatique gauche, qui correspond au lobe gauche morphologique (séparé du lobe droit par le ligament falciforme), vers la veine cave inférieure. En 3D : maillage groupé hepatic_veins, non séparable (audit fig. 74).", "en": "Left hepatic vein — runs in the left scissura; it drains the left suprahepatic sector, which corresponds to the morphological left lobe (separated from the right lobe by the falciform ligament), into the inferior vena cava. In 3D: grouped hepatic_veins mesh, not separable (audit fig. 74)."}}], "edges": [["porte", "br_d"], ["porte", "br_g"], ["porte", "seg1"], ["br_d", "seg1", 1], ["br_g", "seg1", 1], ["br_d", "sect_ad"], ["br_d", "sect_pd"], ["br_g", "sect_mg"], ["br_g", "sect_lg"], ["sect_ad", "seg8"], ["sect_ad", "seg5"], ["sect_pd", "seg7"], ["sect_pd", "seg6"], ["sect_mg", "seg4"], ["sect_lg", "seg2"], ["sect_lg", "seg3"], ["sect_pd", "vh_d", 1], ["sect_ad", "vh_m", 1], ["sect_mg", "vh_m", 1], ["sect_lg", "vh_g", 1]]};
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const nodes = {}; D.nodes.forEach(n => nodes[n.id] = n);
const HW = n => n.r ? n.r : (n.w || 120) / 2;
const HH = n => n.r ? n.r : 27;
document.getElementById('legende').innerHTML =
  Object.values(D.levels).map(l =>
    `<span class="chip"><i style="background:${l.c}"></i>${l.fr}</span>`).join('');
function el(tag, attrs) { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
D.edges.forEach(e => {
  const [a, b, sec] = e, A = nodes[a], B = nodes[b];
  const x1 = A.x + HW(A), y1 = A.y, x2 = B.x - HW(B), y2 = B.y;
  const dx = Math.max(24, Math.abs(x2 - x1) / 2);
  const p = el('path', { d: `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`,
    class: 'edge' + (sec ? ' sec' : ''), 'data-a': a, 'data-b': b });
  svg.appendChild(p);
});
D.nodes.forEach(n => {
  const g = el('g', { class: 'nd', 'data-id': n.id });
  const col = (D.levels[n.lvl] || {}).c || '#ccc';
  if (n.r) {
    g.appendChild(el('circle', { cx: n.x, cy: n.y, r: n.r + 5, fill: col, stroke: '#0c1013' }));
    const t = el('text', { x: n.x, y: n.y + n.r + 22, 'text-anchor': 'middle', class: 'lb' });
    t.setAttribute('fill', '#eef2f5'); t.textContent = n.label; g.appendChild(t);
  } else {
    g.appendChild(el('rect', { x: n.x - HW(n), y: n.y - HH(n), width: n.w || 120,
      height: HH(n) * 2, rx: 9, fill: col, stroke: '#0c1013' }));
    const t = el('text', { x: n.x, y: n.y - (n.sub ? 2 : -5), 'text-anchor': 'middle', class: 'lb' });
    t.textContent = n.label; g.appendChild(t);
    if (n.sub) { const s = el('text', { x: n.x, y: n.y + 15, 'text-anchor': 'middle', class: 'sb' });
      s.textContent = n.sub; g.appendChild(s); }
  }
  g.addEventListener('click', () => select(n.id));
  svg.appendChild(g);
});
function select(id) {
  const f = document.getElementById('fiche'), n = nodes[id];
  const linked = new Set([id]);
  document.querySelectorAll('.edge').forEach(p => {
    const on = p.dataset.a === id || p.dataset.b === id;
    p.classList.toggle('on', on);
    if (on) { linked.add(p.dataset.a); linked.add(p.dataset.b); }
  });
  document.querySelectorAll('.nd').forEach(g => {
    g.classList.toggle('on', g.dataset.id === id);
    g.classList.toggle('linked', linked.has(g.dataset.id) && g.dataset.id !== id);
  });
  svg.classList.add('dim');
  f.innerHTML = `<h2>${n.label}</h2>` +
    (n.sub ? `<div class="sub">${n.sub}</div>` : '') +
    `<p>${(n.desc && n.desc.fr) || ''}</p>` +
    (n.note ? `<div class="note3d">⚠ ${n.note}</div>` : '');
}
window.__diagramReady = true;
</script>
