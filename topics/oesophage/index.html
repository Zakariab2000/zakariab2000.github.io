<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staging Batch C — Abdomen digestif (figs 59–72)</title>
<style>
  body { margin:0; background:#14161a; color:#e8e4da; font-family:system-ui, sans-serif; }
  a { color:#9fc3e8; }
  #bar { position:fixed; top:0; left:0; right:0; padding:8px 12px; background:rgba(20,22,26,.88);
         display:flex; gap:8px; align-items:center; z-index:10; flex-wrap:wrap; }
  #bar b { font-size:14.5px; }
  #bar span { font-size:12px; opacity:.75; }
  button, .chip { background:#2a2e36; color:#e8e4da; border:1px solid #4a4f59; border-radius:6px;
           padding:5px 10px; font-size:12.5px; cursor:pointer; text-decoration:none; }
  button.on, .chip.on { background:#5b4a7a; border-color:#b197fc; }
  #scene { position:fixed; inset:0; }
  #err { position:fixed; bottom:8px; right:8px; color:#ff8080; font-size:12px; white-space:pre-wrap; z-index:30; max-width:60vw; }

  /* liste des structures de la figure (noms FR) */
  #structs { position:fixed; top:96px; right:8px; z-index:12; width:172px; max-height:46vh; overflow:auto;
             background:rgba(20,22,26,.85); border:1px solid #3a3f49; border-radius:8px; padding:6px 8px; }
  #structs h4 { margin:2px 0 5px; font-size:11.5px; opacity:.85; }
  #structs .st { display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid #2c3038;
                 padding:4px 2px; font-size:11px; color:#e8e4da; cursor:pointer; }
  #structs .st small { opacity:.55; font-size:9.5px; }
  #structs .st.sel { color:#ffd43b; }

  /* fiche structure touchée */
  #fiche { position:fixed; right:8px; bottom:8px; z-index:16; width:250px; display:none;
           background:rgba(26,29,35,.94); border:1px solid #4a4f59; border-radius:10px; padding:10px 12px; }
  #fiche b { font-size:14px; display:block; }
  #fiche .en { font-size:12px; opacity:.75; }
  #fiche .la { font-size:11.5px; opacity:.6; font-style:italic; }
  #fiche .meta { font-size:11px; margin-top:5px; opacity:.8; }
  #fiche button { margin-top:7px; }

  /* panneau « manquants » (limites honnêtes de la figure) */
  #gaps { position:fixed; left:8px; top:96px; z-index:12; width:250px; max-height:52vh; overflow:auto; display:none;
          background:rgba(35,28,20,.94); border:1px solid #8a6d3b; border-radius:8px; padding:8px 11px;
          font-size:11.5px; line-height:1.45; }
  #gaps b { color:#ffd43b; font-size:12px; }
  #gaps li { margin:4px 0 4px -12px; }

  /* ===== cartes « Espaces » (coin bas-gauche) — règle utilisateur 2026-10-23 ===== */
  #spaces { position:fixed; left:10px; bottom:10px; z-index:15; width:248px;
            pointer-events:none; display:none; flex-direction:column; gap:6px; }
  #spaces .sp-head { background:rgba(20,22,26,.82); border:1px solid #3a3f49;
            border-radius:8px; padding:7px 10px; }
  #spaces .sp-head b { font-size:13px; display:block; }
  #spaces .sp-head span { font-size:11px; opacity:.7; }
  .sp-card { pointer-events:auto; display:flex; align-items:center; gap:9px; text-align:left;
            background:rgba(26,29,35,.88); border:1px solid #3a3f49; border-radius:8px;
            padding:8px 10px; width:100%; color:#e8e4da; cursor:pointer; }
  .sp-card .dot { flex:0 0 auto; width:14px; height:14px; border-radius:50%;
            border:2px solid rgba(255,255,255,.35); }
  .sp-card .nm { flex:1 1 auto; font-size:12.5px; line-height:1.25; }
  .sp-card .nm small { display:block; font-size:10px; opacity:.6; }
  .sp-card .st { flex:0 0 auto; font-size:11px; opacity:.55; }
  .sp-card.on { border-color:#e8e4da; background:rgba(42,46,56,.95);
            box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 2px 10px rgba(0,0,0,.5); }
  .sp-card.on .st { opacity:1; }

  /* accueil */
  #home { position:fixed; inset:0; overflow:auto; padding:70px 16px 20px; display:none; }
  #home h1 { font-size:19px; }
  #home .topic { background:#1d2026; border:1px solid #3a3f49; border-radius:10px; padding:12px 14px; margin:10px 0; }
  #home .topic b { font-size:15px; }
  #home .figs { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }

  @media (max-width:640px) {
    #spaces { width:186px; bottom:8px; left:8px; }
    #structs { width:138px; top:172px; }
    #fiche { width:200px; }
    #gaps { width:200px; top:172px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../assets/three/three.module.js",
  "three/addons/": "../../assets/three/addons/"
} }
</script>
</head>
<body>
<div id="bar">
  <a class="chip" href="./index.html">← Batch C</a>
  <b id="title">Chargement…</b>
  <span id="figtitle"></span>
  <span id="figchips"></span>
  <button id="b-gaps" style="display:none">⚠ Limites de la figure</button>
  <a id="b-diagram" class="chip" style="display:none" href="./diagram-canalaire.html">Schéma interactif</a>
  <button id="b-view" style="display:none"> recentrer</button>
  <span id="stat"></span>
</div>
<div id="scene"></div>
<div id="structs" style="display:none"><h4>Structures de la figure</h4><div id="stlist"></div></div>
<div id="gaps"></div>
<div id="fiche"></div>
<div id="spaces">
  <div class="sp-head"><b>Espaces</b>
    <span>Touchez une carte : l'espace se crée, coloré, dans le modèle (volume schématique délimité par ses parois). Re-touchez pour l'effacer.</span></div>
</div>
<div id="home"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const errors = [];
window.__errors = errors;
window.addEventListener('error', e => { errors.push(String(e.message)); showErr(); });
function showErr(){ document.getElementById('err').textContent = errors.join('\n'); }

const TOPICS = ['canal-inguinal', 'oesophage', 'estomac', 'loge-duodeno-pancreatique'];
const q = new URLSearchParams(location.search);
const slug = q.get('sujet') || 'oesophage';

/* ---------------- accueil ---------------- */
if (!slug) {
  document.getElementById('title').textContent = 'Batch C — Abdomen digestif';
  const home = document.getElementById('home');
  home.style.display = 'block';
  home.innerHTML = '<h1>Sujets du cours — Batch C (staging)</h1>' +
    '<p style="opacity:.75;font-size:13px">Scènes construites uniquement depuis l\'audit des figures ' +
    '(data/FIGURES-AUDIT.json) et le manifeste de l\'atlas. Aucun ID inventé.</p>';
  for (const s of TOPICS) {
    const sc = await (await fetch(`./scene-${s}.json`)).json();
    const div = document.createElement('div');
    div.className = 'topic';
    div.innerHTML = `<b>${sc.numero}. ${sc.titre_fr}</b> <span style="opacity:.6">(${sc.titre_en})</span>` +
      `<div class="figs">${sc.figures.map(f =>
        `<a class="chip" href="./index.html?sujet=${s}&fig=${f.numero}">Fig. ${f.numero} — ${f.titre_fr}</a>`).join('')}</div>`;
    home.appendChild(div);
  }
  window.__batchCTest = { home: true, state: () => ({ home: true, errors }) };
} else {

/* ---------------- visionneuse de scène ---------------- */
const sceneData = await (await fetch(`./scene-${slug}.json`)).json();
const GLB_BASE = sceneData.glb_base;
let figNum = parseInt(q.get('fig') || sceneData.figures[0].numero, 10);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 8000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('scene').appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const d1 = new THREE.DirectionalLight(0xffffff, 1.9); d1.position.set(150, 300, 400); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xbfd0ff, 0.5); d2.position.set(-300, 100, -200); scene.add(d2);

const loader = new GLTFLoader();
const group = new THREE.Group(); scene.add(group);
const byId = {};       // id -> {entry, obj, mats}
const pickMeshes = []; // meshes cliquables (sujet + contexte non fantôme d'abord)
let loadedCount = 0, totalCount = 0;
window.__loadedCount = 0;

let currentFig = null;
const spaceState = {}; // key -> {mat, mesh, target, card}

function matFor(entry) {
  const ghost = entry.ghost, ctx = entry.role === 'contexte';
  const opacity = ghost ? 0.16 : ctx ? 0.38 : 1.0;
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(entry.couleur), roughness: 0.6, metalness: 0.05,
    transparent: opacity < 1, opacity, side: THREE.DoubleSide,
    depthWrite: opacity === 1 });
}

function applyCamera(fig) {
  camera.position.fromArray(fig.camera.position);
  controls.target.fromArray(fig.camera.target);
  controls.update();
}

function clearGroup() {
  while (group.children.length) {
    const c = group.children.pop();
    c.traverse(o => { if (o.isMesh) { o.geometry.dispose(); } });
    group.remove(c);
  }
  for (const k of Object.keys(byId)) delete byId[k];
  pickMeshes.length = 0;
  for (const k of Object.keys(spaceState)) delete spaceState[k];
  document.getElementById('spaces').style.display = 'none';
  document.querySelectorAll('.sp-card').forEach(c => c.remove());
  select(null);
}

function openFigure(num) {
  const fig = sceneData.figures.find(f => f.numero === num);
  if (!fig) return;
  currentFig = fig; figNum = num;
  clearGroup();
  loadedCount = 0; totalCount = fig.structures.length;
  window.__loadedCount = 0;
  document.getElementById('title').textContent =
    `${sceneData.numero}. ${sceneData.titre_fr}`;
  document.getElementById('figtitle').textContent =
    `Fig. ${fig.numero} — ${fig.titre_fr} [${fig.classe}]`;
  document.getElementById('stat').textContent = 'chargement…';
  document.querySelectorAll('#figchips .chip').forEach(c =>
    c.classList.toggle('on', +c.dataset.fig === num));
  const bd = document.getElementById('b-diagram');
  bd.style.display = fig.diagram ? '' : 'none';
  const bg = document.getElementById('b-gaps');
  bg.style.display = fig.manquants.length ? '' : 'none';
  document.getElementById('gaps').style.display = 'none';
  document.getElementById('gaps').innerHTML =
    '<b>Limites honnêtes (audit)</b><ul>' +
    fig.manquants.map(m => `<li>${m}</li>`).join('') + '</ul>';
  document.getElementById('b-view').style.display = '';
  document.getElementById('structs').style.display = '';
  const stl = document.getElementById('stlist');
  stl.innerHTML = '';
  for (const entry of fig.structures) {
    const b = document.createElement('button');
    b.className = 'st'; b.dataset.id = entry.id;
    b.innerHTML = `${entry.nom_fr} <small>${entry.role}${entry.ghost ? ' · fantôme' : ''}</small>`;
    b.addEventListener('click', () => select(entry.id));
    stl.appendChild(b);
    loader.load(GLB_BASE + entry.file, gltf => {
      const mat = matFor(entry);
      gltf.scene.traverse(o => { if (o.isMesh) { o.material = mat; o.userData.sid = entry.id; pickMeshes.push(o); } });
      group.add(gltf.scene);
      byId[entry.id] = { entry, obj: gltf.scene, mat };
      loadedCount++; window.__loadedCount = loadedCount;
      document.getElementById('stat').textContent = `${loadedCount}/${totalCount} structures`;
    }, undefined, err => { errors.push(entry.id + ': ' + err.message); showErr(); });
  }
  buildSpaces(fig);
  applyCamera(fig);
}

/* ---- espaces : volume schématique calculé depuis les bornes ---- */
function capsuleBetween(A, B, r, color) {
  const dir = new THREE.Vector3().subVectors(B, A);
  const len = dir.length();
  const geo = new THREE.CapsuleGeometry(r, len, 6, 14);
  const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color),
    roughness: 0.35, metalness: 0, transparent: true, opacity: 0, side: THREE.DoubleSide,
    depthWrite: false, depthTest: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 10; // volume schématique : toujours lisible à travers les parois
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.visible = false;
  return { mesh, mat };
}
const FITTERS = {
  // Canal inguinal : capsule oblique au-dessus du ligament inguinal,
  // de l'anneau profond (latéral) vers l'anneau superficiel (médial),
  // bornée par les 5 parois maillées de la fig. 59.
  'canal-inguinal': (esp) => {
    const lig = new THREE.Box3().setFromObject(byId['inguinal_ligament_right'].obj);
    const A = new THREE.Vector3(THREE.MathUtils.lerp(lig.min.x, lig.max.x, 0.28), lig.max.y - 12, lig.min.z - 8);
    const B = new THREE.Vector3(THREE.MathUtils.lerp(lig.min.x, lig.max.x, 0.90), lig.max.y - 34, lig.max.z - 2);
    return capsuleBetween(A, B, 11, esp.couleur);
  },
};
function buildSpaces(fig) {
  if (!fig.espaces.length) return;
  const panel = document.getElementById('spaces');
  panel.style.display = 'flex';
  for (const esp of fig.espaces) {
    const card = document.createElement('button');
    card.className = 'sp-card'; card.id = 'card-' + esp.key;
    card.innerHTML = `<span class="dot" style="background:${esp.couleur}"></span>` +
      `<span class="nm">${esp.nom_fr}<small>volume schématique — parois : ${esp.bornes.length} structures</small></span>` +
      `<span class="st">＋</span>`;
    card.addEventListener('click', () => setSpace(esp.key, !(spaceState[esp.key] && spaceState[esp.key].target > 0.5)));
    panel.appendChild(card);
    spaceState[esp.key] = { esp, target: 0, card, built: null };
  }
}
function setSpace(key, on, instant = false) {
  const st = spaceState[key];
  if (!st) return;
  if (on && !st.built) {
    const fitter = FITTERS[key];
    if (!fitter) { errors.push('espace sans fitter: ' + key); showErr(); return; }
    st.built = fitter(st.esp);
    group.add(st.built.mesh);
  }
  st.target = on ? 1 : 0;
  if (st.built) {
    st.built.mesh.visible = true;
    if (instant) st.built.mat.opacity = on ? 0.6 : 0;
  }
  st.card.classList.toggle('on', on);
  st.card.querySelector('.st').textContent = on ? '✕' : '＋';
}

/* ---- sélection + fiche ---- */
let selected = null;
function select(id) {
  if (selected && byId[selected]) byId[selected].mat.emissive = new THREE.Color(0x000000);
  selected = id;
  document.querySelectorAll('#stlist .st').forEach(b => b.classList.toggle('sel', b.dataset.id === id));
  const fiche = document.getElementById('fiche');
  if (!id || !byId[id]) { fiche.style.display = 'none'; return; }
  const e = byId[id].entry;
  byId[id].mat.emissive = new THREE.Color(0x554400);
  fiche.innerHTML = `<b>${e.nom_fr}</b>` +
    `<div class="en">${e.name_en}</div>` +
    (e.name_la ? `<div class="la">${e.name_la}</div>` : '') +
    `<div class="meta">Rôle : ${e.role}${e.ghost ? ' (fantôme)' : ''} · Système : ${e.system}</div>` +
    `<button onclick="document.getElementById('fiche').style.display='none'">Fermer</button>`;
  fiche.style.display = 'block';
}
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let downAt = 0;
renderer.domElement.addEventListener('pointerdown', () => { downAt = performance.now(); });
renderer.domElement.addEventListener('pointerup', ev => {
  if (performance.now() - downAt > 350) return; // glisser = orbite, pas un tap
  ptr.x = (ev.clientX / innerWidth) * 2 - 1;
  ptr.y = -(ev.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickMeshes, false);
  if (hits.length) select(hits[0].object.userData.sid);
});

/* chips figures */
const chips = document.getElementById('figchips');
for (const f of sceneData.figures) {
  const a = document.createElement('a');
  a.className = 'chip'; a.dataset.fig = f.numero; a.textContent = 'Fig. ' + f.numero;
  a.href = `./index.html?sujet=${slug}&fig=${f.numero}`;
  a.addEventListener('click', ev => { ev.preventDefault(); openFigure(f.numero); });
  chips.appendChild(a);
}
document.getElementById('b-view').addEventListener('click', () => currentFig && applyCamera(currentFig));
document.getElementById('b-gaps').addEventListener('click', () => {
  const g = document.getElementById('gaps');
  g.style.display = g.style.display === 'none' ? 'block' : 'none';
});

openFigure(figNum);

window.__batchCTest = {
  state: () => ({ sujet: slug, fig: figNum, loaded: loadedCount, total: totalCount,
                  errors, spaces: Object.fromEntries(Object.entries(spaceState).map(([k, v]) => [k, v.target])) }),
  openFigure, setSpace, select,
};

renderer.setAnimationLoop(() => {
  for (const st of Object.values(spaceState)) {
    if (!st.built) continue;
    const goal = st.target * 0.6, cur = st.built.mat.opacity;
    if (Math.abs(goal - cur) > 0.004) {
      st.built.mat.opacity = cur + (goal - cur) * 0.14;
      st.built.mesh.visible = st.built.mat.opacity > 0.01;
    } else if (goal === 0) st.built.mesh.visible = false;
  }
  controls.update(); renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
}
</script>
</body>
</html>
