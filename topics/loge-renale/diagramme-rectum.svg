<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 620" width="390" height="620" role="img" aria-label="Rectum et canal anal — coupe longitudinale">
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="2.2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.title{font-size:14px;font-weight:bold;fill:#f5f0e6}
.sub{font-size:10px;fill:#8a8f98}
.lbl{font-size:9.5px;fill:#c9cfd8}
.lead{stroke:#69707c;stroke-width:.8;fill:none}
.zone{cursor:pointer}
.zone:hover{stroke:#e8c07a;stroke-width:2.5}
.zone.sel{stroke:#ffd166;stroke-width:3.5;filter:url(#glow)}
.zone.sel&gt;*{stroke:#ffd166;stroke-width:2.5}
.ftitle{font-size:13px;font-weight:bold;fill:#f5f0e6}
.fline{font-size:11.5px;fill:#c9cfd8}
.note{font-size:9.5px;fill:#8a8f98}
.dec{pointer-events:none}
</style>
<rect x="0" y="0" width="390" height="620" fill="#101318"/>
<text class="title" x="195" y="30" text-anchor="middle">Rectum et canal anal — coupe longitudinale</text>
<text class="sub" x="195" y="48" text-anchor="middle">Schéma — Fig. 92 · Touchez une zone pour sa fiche</text>

<!-- leader lines -->
<g class="dec">
<line class="lead" x1="128" y1="127" x2="162" y2="205"/>
<line class="lead" x1="128" y1="182" x2="166" y2="242"/>
<line class="lead" x1="128" y1="272" x2="178" y2="338"/>
<line class="lead" x1="128" y1="327" x2="156" y2="322"/>
<line class="lead" x1="262" y1="177" x2="210" y2="308"/>
<line class="lead" x1="262" y1="237" x2="222" y2="346"/>
<line class="lead" x1="262" y1="297" x2="226" y2="330"/>
<line class="lead" x1="262" y1="352" x2="244" y2="360"/>
</g>

<!-- outer wall (muscle) -->
<path class="dec" fill="#b03a2e" stroke="#7b241c" stroke-width="1.5" d="M170,55 L220,55 C225,90 230,105 238,125 C255,160 258,220 250,265 C246,285 232,295 228,310 L228,385 L162,385 L162,310 C158,295 144,285 140,265 C132,220 135,160 152,125 C160,105 165,90 170,55 Z"/>
<!-- lumen -->
<path class="dec" fill="#dfc493" stroke="#a8834f" stroke-width="1.5" d="M180,65 L210,65 C214,95 218,110 226,130 C240,162 242,215 235,255 C232,272 222,282 218,295 L218,368 L172,368 L172,295 C168,282 158,272 155,255 C148,215 150,162 164,130 C172,110 176,95 180,65 Z"/>
<text class="lbl dec" x="240" y="70">sigmoïde</text>

<!-- canal anal zone (behind columns) -->
<path class="zone" data-k="canal" fill="#e0be85" stroke="#a8834f" stroke-width="1.5" d="M166,292 L224,292 L224,378 L166,378 Z"><title>Canal anal</title></path>
<!-- ampoule rectale -->
<path class="zone" data-k="ampoule" fill="#ecd9a8" stroke="#a8834f" stroke-width="1.5" d="M162,178 C182,163 212,163 231,178 C240,208 238,244 229,261 C209,275 181,275 163,261 C153,244 153,208 162,178 Z"><title>Ampoule rectale</title></path>
<!-- valvules de Houston (3 folds, 1 zone) -->
<g class="zone" data-k="houston" stroke="#8c6a2f" stroke-width="1.5" fill="#d9a05b"><title>Valvules de Houston</title>
<path d="M154,138 L202,147 L202,161 L154,168 Z"/>
<path d="M236,184 L188,193 L188,207 L236,212 Z"/>
<path d="M157,230 L204,239 L204,253 L157,257 Z"/>
</g>
<!-- sphincter interne -->
<g class="zone" data-k="sphinterne" stroke="#5e1f19" stroke-width="1.5" fill="#8e2f26"><title>Sphincter interne</title>
<rect x="150" y="298" width="17" height="54" rx="6"/>
<rect x="223" y="298" width="17" height="54" rx="6"/>
</g>
<!-- sphincter externe -->
<g class="zone" data-k="sphexterne" stroke="#4a150f" stroke-width="1.5" fill="#7a1f1a"><title>Sphincter externe</title>
<rect x="138" y="330" width="18" height="58" rx="6"/>
<rect x="234" y="330" width="18" height="58" rx="6"/>
</g>
<g class="dec" stroke="#c97b5a" stroke-width="1">
<line x1="141" y1="342" x2="153" y2="342"/><line x1="141" y1="354" x2="153" y2="354"/><line x1="141" y1="366" x2="153" y2="366"/>
<line x1="237" y1="342" x2="249" y2="342"/><line x1="237" y1="354" x2="249" y2="354"/><line x1="237" y1="366" x2="249" y2="366"/>
</g>
<!-- colonnes de Morgagni -->
<g class="zone" data-k="colonnes" stroke="#8c6a2f" stroke-width="1.5" fill="#d9a05b"><title>Colonnes de Morgagni</title>
<rect x="174" y="296" width="6" height="38" rx="3"/>
<rect x="184" y="296" width="6" height="38" rx="3"/>
<rect x="194" y="296" width="6" height="38" rx="3"/>
<rect x="204" y="296" width="6" height="38" rx="3"/>
<rect x="214" y="296" width="6" height="38" rx="3"/>
</g>
<!-- sinus anaux -->
<g class="zone" data-k="sinus" stroke="#5e4512" stroke-width="1.5" fill="#8c6a2f"><title>Sinus anaux</title>
<circle cx="182" cy="340" r="4.5"/>
<circle cx="192" cy="343" r="4.5"/>
<circle cx="202" cy="343" r="4.5"/>
<circle cx="212" cy="340" r="4.5"/>
</g>
<!-- ligne pectinee -->
<rect class="zone" data-k="ligne" x="168" y="346" width="54" height="7" fill="#c97b5a" stroke="#7a3b2e" stroke-width="1.5"><title>Ligne pectinée</title></rect>
<text class="lbl dec" x="195" y="404" text-anchor="middle">anus</text>

<!-- labels -->
<g>
<text class="lbl" x="128" y="130" text-anchor="end">Ampoule rectale</text>
<text class="lbl" x="128" y="185" text-anchor="end">Valvules de Houston</text>
<text class="lbl" x="128" y="275" text-anchor="end">Sinus anaux</text>
<text class="lbl" x="128" y="330" text-anchor="end">Sphincter interne</text>
<text class="lbl" x="262" y="180">Colonnes de Morgagni</text>
<text class="lbl" x="262" y="240">Ligne pectinée</text>
<text class="lbl" x="262" y="300">Canal anal</text>
<text class="lbl" x="262" y="355">Sphincter externe</text>
</g>

<!-- fiche -->
<rect x="14" y="430" width="362" height="112" rx="12" fill="#1a1e26"/>
<text id="ficheTitle" class="ftitle" x="28" y="458">Fiche anatomique</text>
<text class="fline"><tspan id="fl0" x="28" y="480">Touchez une zone du schéma pour afficher sa fiche.</tspan><tspan id="fl1" x="28" dy="17"></tspan><tspan id="fl2" x="28" dy="17"></tspan><tspan id="fl3" x="28" dy="17"></tspan></text>
<text class="note" x="195" y="566" text-anchor="middle">Le rectum 3D est un maillage unique : valvules, colonnes et sinus</text>
<text class="note" x="195" y="581" text-anchor="middle">ne sont pas modélisés — ce schéma montre l'intérieur en regard.</text>

<script><![CDATA[
var DATA={
ampoule:{t:"Ampoule rectale",l:["Dilatation terminale au-dessus du canal anal :","réservoir des matières fécales."]},
houston:{t:"Valvules de Houston",l:["Replis transversaux semi-lunaires (muqueuse +","circulaire) soutenant le bol fécal. La moyenne","repère le niveau du cul-de-sac de Douglas."]},
colonnes:{t:"Colonnes de Morgagni",l:["Replis longitudinaux de la muqueuse du canal","anal, au nombre de 8 à 10."]},
sinus:{t:"Sinus anaux",l:["Dépressions entre les colonnes, où s'abouchent","les glandes anales (cryptes)."]},
ligne:{t:"Ligne pectinée",l:["Jonction colonnes/valvules anales : limite entre","muqueuse rectale et anale, repère majeur."]},
canal:{t:"Canal anal",l:["Segment terminal de 3–4 cm, entouré des","sphincters, de la ligne pectinée à l'anus."]},
sphinterne:{t:"Sphincter interne",l:["Épaississement de la couche circulaire lisse :","sphincter involontaire."]},
sphexterne:{t:"Sphincter externe",l:["Muscle strié volontaire (3 faisceaux),","sous contrôle du nerf pudendal."]}
};
var fT=document.getElementById('ficheTitle');
var fL=[document.getElementById('fl0'),document.getElementById('fl1'),document.getElementById('fl2'),document.getElementById('fl3')];
function select(k){
  var d=DATA[k]; if(!d) return;
  var zones=document.querySelectorAll('.zone');
  for(var i=0;i<zones.length;i++){ zones[i].classList.remove('sel'); }
  var els=document.querySelectorAll('[data-k="'+k+'"]');
  for(var j=0;j<els.length;j++){ els[j].classList.add('sel'); }
  fT.textContent=d.t;
  for(var n=0;n<fL.length;n++){ fL[n].textContent=(n<d.l.length)?d.l[n]:''; }
}
var zs=document.querySelectorAll('.zone');
for(var i=0;i<zs.length;i++){
  zs[i].addEventListener('click',function(ev){ select(ev.currentTarget.getAttribute('data-k')); });
}
]]></script>
</svg>
